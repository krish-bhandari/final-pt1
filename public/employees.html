<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employees - HR Portal</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
<script src="js/api.js"></script>
<script>requireLogin();</script>
    <div class="dashboard-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                HR Portal
            </div>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="employees.html" class="active">
                    Employees
                </a>

                <a href="leaves.html">
                    Leave Management
                </a>

                <a href="announcements.html">
                    Announcements
                </a>

            </nav>

            <button
                class="logout-button"
                onclick="logout()">
                Logout
            </button>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <header class="top-header">

                <div>
                    <h1>Employees</h1>

                    <p>
                        Manage organization employees
                    </p>
                </div>

                <div class="admin-profile">
                    Admin
                </div>

            </header>


            <!-- Add Employee -->

            <section class="form-section">

                <h2>Add New Employee</h2>

                <form id="employeeForm">

                    <div class="form-grid">

                        <div>

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter full name"
                                required>

                        </div>


                        <div>

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter email"
                                required>

                        </div>


                        <div>

                            <label for="department">
                                Department
                            </label>

                            <select id="department" required>

                                <option value="">
                                    Select Department
                                </option>

                                <option value="IT">
                                    IT
                                </option>

                                <option value="HR">
                                    HR
                                </option>

                                <option value="Finance">
                                    Finance
                                </option>

                                <option value="Marketing">
                                    Marketing
                                </option>

                            </select>

                        </div>


                        <div>

                            <label for="position">
                                Position
                            </label>

                            <input
                                type="text"
                                id="position"
                                placeholder="e.g. Software Developer"
                                required>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="primary-button">

                        Add Employee

                    </button>

                </form>

            </section>


            <!-- Employee List -->

            <section class="dashboard-section">

                <div class="employee-header">

                    <h2>Employee List</h2>

                    <input
                        type="text"
                        id="searchEmployee"
                        placeholder="Search employee...">

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Email</th>

                                <th>Department</th>

                                <th>Position</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="employeeTableBody">

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    
    <script src="js/employees.js"></script>

</body>

</html>
